# Composite setup shared by the CI and release-prep jobs: pnpm, the pinned Node
# and a frozen install. The toolchain is defined once — pnpm's version comes
# from package.json "packageManager", Node's from .nvmrc. Assumes the repo is
# already checked out (this action lives in it).
name: setup
description: Install pnpm, the pinned Node, and dependencies (frozen lockfile).

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile
